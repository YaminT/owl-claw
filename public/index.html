<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OwlClaw</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/owl-icon.png" />
  </head>
  <body>
    <aside class="sidebar">
      <header class="brand">
        <img class="brand-mark" src="/owl-icon.png" alt="OwlClaw" />
        <span class="brand-name">OwlClaw</span>
      </header>
      <nav>
        <a class="nav-btn" data-nav="instructions" href="#/">
          <span>Instructions</span>
          <span class="nav-count" data-count="waiting">0</span>
        </a>
        <a class="nav-btn" data-nav="configuration" href="#/config">
          <span>Configuration</span>
          <span class="nav-count" id="nav-health-dot">●</span>
        </a>
      </nav>
      <footer class="sidebar-footer">
        <div class="health">
          <span id="worker-state-label">worker idle</span>
          <span id="worker-state-dot" class="dot"></span>
        </div>
        <div id="worker-current" class="sidebar-current"></div>
      </footer>
    </aside>

    <main class="main">
      <!-- LIST view -->
      <section id="view-list" class="view">
        <div class="view-header">
          <h1>Instructions</h1>
          <div class="header-actions">
            <a id="new-link" class="btn primary" href="#/new">+ New instruction</a>
            <button id="refresh-btn" class="btn" type="button" title="Refresh list">↻</button>
          </div>
        </div>

        <div class="task-list-panel full">
          <table id="task-table">
            <thead>
              <tr>
                <th>Filename</th>
                <th>Status</th>
                <th>Stage</th>
                <th>Retries</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody id="task-tbody">
              <tr><td colspan="5" class="muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- EDITOR view -->
      <section id="view-editor" class="view">
        <div class="view-header">
          <div class="view-title">
            <a class="btn ghost back-btn" href="#/">← Instructions</a>
            <h1 id="editor-heading">New instruction</h1>
            <span class="status-pill" id="editor-status-pill" data-status="">NEW</span>
          </div>
          <div class="header-actions" id="editor-actions">
            <button id="requeue-btn" class="btn" type="button" hidden>Reopen as waiting</button>
            <button id="delete-btn" class="btn danger" type="button" hidden>Delete</button>
            <button id="save-btn" class="btn primary" type="button">Save</button>
          </div>
        </div>

        <div class="editor-card">
          <div class="editor-row">
            <label for="editor-filename" class="field-label">Filename</label>
            <input id="editor-filename" class="filename-input" type="text" placeholder="my-task.md" autocomplete="off" />
          </div>

          <div id="editor-meta" class="editor-meta"></div>

          <label for="editor-content" class="field-label">Content (Markdown)</label>
          <textarea id="editor-content" class="editor-textarea" spellcheck="false" placeholder="# Task title&#10;&#10;Describe the work to do…"></textarea>
        </div>
      </section>

      <!-- CONFIGURATION view -->
      <section id="view-config" class="view">
        <div class="view-header">
          <h1>Configuration</h1>
          <button id="refresh-health-btn" class="btn" type="button">↻ Re-check</button>
        </div>
        <div id="health-grid" class="health-grid">
          <div class="card">
            <h2>Claude CLI</h2>
            <dl id="claude-card" class="kv"><dt>loading…</dt><dd></dd></dl>
          </div>
          <div class="card">
            <h2>Codex CLI</h2>
            <dl id="codex-card" class="kv"><dt>loading…</dt><dd></dd></dl>
          </div>
          <div class="card">
            <h2>Paths</h2>
            <dl id="paths-card" class="kv"><dt>loading…</dt><dd></dd></dl>
          </div>
          <div class="card">
            <h2>Runner</h2>
            <dl id="runner-card" class="kv"><dt>loading…</dt><dd></dd></dl>
          </div>
          <div class="card">
            <h2>Worker</h2>
            <dl id="worker-card" class="kv"><dt>loading…</dt><dd></dd></dl>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/app.js" defer></script>
  </body>
</html>
